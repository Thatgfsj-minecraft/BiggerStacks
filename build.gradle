buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

version = "$minecraftVersion-$modVersion"
group = 'portb'
archivesBaseName = 'biggerstacks'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'parchment', version: "$parchmentVersion-$minecraftVersion"

    copyIdeResources = true
    generateRunFolders = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biggerstacks'
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"

            args(["--username", "Dev###"])

            mods {

                biggerstacks {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('serverrun')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biggerstacks'

            mods {
                biggerstacks {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('gametestrun')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biggerstacks'

            mods {
                biggerstacks {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('datarun')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'biggerstacks', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                biggerstacks {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "biggerstacks.refmap.json"

    config "biggerstacks.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = "https://codeberg.org/api/packages/PORTB/maven"
    }
    maven { // JEI
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository) // Only add this if you're using ForgeGradle, otherwise remove this line
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:$minecraftVersion-$forgeVersion"

    //
    // Embedded libraries
    //
    jarJar.enable()
    project.configurations.minecraftLibrary.extendsFrom(project.configurations.jarJar)

    jarJar "portb:BiggerStacksConfigLib:$configLibVersion",
            "portb:BiggerStacksTransformerLib:$transformerLibVersion",
            "portb:SimpleLoggerWrapper:$simpleLoggerWrapperVersion"

    jarJar("com.thoughtworks.xstream:xstream:[1.4.20]") {
        //we do not want xstream's built in parser. We will use stax.
        exclude group: 'io.github.x-stream', module: 'mxparser'
    }

    //
    // Mixin
    //
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("maven.modrinth:ae2:forge-12.9.9")
    implementation fg.deobf("maven.modrinth:modular-routers:1.19.2-10.2.1")
    implementation fg.deobf("maven.modrinth:pretty-pipes:1.13.6")
    implementation fg.deobf("maven.modrinth:refined-storage:1.11.7")
    implementation fg.deobf("maven.modrinth:create:1.19.2-0.5.1.i")
    implementation fg.deobf("maven.modrinth:sophisticated-core:1.19.2-0.6.4.730")
    implementation fg.deobf("maven.modrinth:sophisticated-backpacks:1.19.2-3.20.2.1035")
    implementation fg.deobf("maven.modrinth:sophisticated-storage:1.19.2-0.9.7.765")
    implementation fg.deobf("curse.maven:backpacked-352835:4725664")

    runtimeOnly fg.deobf("maven.modrinth:cloth-config:8.3.134+forge")
    runtimeOnly fg.deobf("maven.modrinth:architectury-api:6.6.92+forge")
    runtimeOnly fg.deobf("maven.modrinth:rei:9.2.784+forge")
    runtimeOnly fg.deobf("maven.modrinth:roughly-enough-items-hacks:9.0.90")
    runtimeOnly fg.deobf("maven.modrinth:unifiedoptions:1.19.2-1.1")
}

jar {
    manifest {
        attributes([
                "Specification-Title"        : "biggerstacks",
                "Implementation-Title"       : project.name,
                "Implementation-Version"     : project.jar.archiveVersion.get(),
                "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TransformerLib-Version"     : transformerLibVersion,
                "ConfigLib-Version"          : configLibVersion,
                "SimpleLoggerWrapper-Version": simpleLoggerWrapperVersion
        ])
    }
}

reobf {
    jarJar {}
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

modrinth {
    token = MODRINTH_TOKEN
    projectId = modrinthProjectId
    versionNumber = "${project.archivesBaseName}-${project.version}"
    uploadFile = tasks.jarJar.outputs.files.getSingleFile()
    gameVersions = [minecraftVersion]
    loaders = ["forge"]

    if(gradle.startParameter.taskNames.contains("modrinth"))
        changelog = ChangelogPrompt.promptForChangelog("Released version ${project.version}")
}