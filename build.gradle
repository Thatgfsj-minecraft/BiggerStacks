plugins {
    id 'fabric-loom' version '1.17.21'
}

version = "${minecraft_version}-${mod_version}"
group = 'portb'

base {
    archivesName = 'biggerstacks-fabric'
}

repositories {
    mavenCentral()

    // Vendored PORTB libraries (same local maven repository as the NeoForge branch)
    maven { url = uri("libs/maven") }
}

loom {
    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev###'
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Bundled at runtime through src/main/resources/META-INF/jars + fabric.mod.json "jars"
    implementation 'portb:BiggerStacksConfigLib:2026.02.25'
    implementation 'portb:SimpleLoggerWrapper:1.0'
    implementation('com.thoughtworks.xstream:xstream:1.4.21') {
        exclude group: 'io.github.x-stream', module: 'mxparser'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def modFullVersion = version.toString()

processResources {
    inputs.property 'version', modFullVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modFullVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
