plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = "${minecraftVersion}-${modVersion}"
group = 'portb'
base { archivesName = 'biggerstacks' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforgeVersion
    validateAccessTransformers = true

    runs {
        client { client() }
        server {
            server()
            programArguments.addAll '--nogui'
        }
        data { data() }
        gameTestServer { type = "gameTestServer" }
    }

    mods {
        biggerstacks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    // Vendored PORTB libraries. Upstream publishes these to https://codeberg.org/api/packages/PORTB/maven,
    // which cannot be downloaded anonymously, so the exact artifacts are extracted from the upstream
    // 1.20.1 release jar (META-INF/jarjar/) and kept in libs/maven.
    maven { url = uri("libs/maven") }
}

dependencies {
    // Embedded at build time (jar-in-jar), the mod has no external dependencies at runtime
    jarJar(implementation('portb:BiggerStacksConfigLib:2026.02.25')) {
        version { strictly '[2026.02.25]' }
    }
    jarJar(implementation('portb:SimpleLoggerWrapper:1.0')) {
        version { strictly '[1.0]' }
    }
    jarJar(implementation('com.thoughtworks.xstream:xstream:1.4.21')) {
        version { strictly '[1.4.21]' }
        // The XML parser is not used, BiggerStacksConfigLib configures the STAX driver
        exclude group: 'io.github.x-stream', module: 'mxparser'
    }

    // The XML based transformer engine used for third-party mod compatibility.
    // Not bundled in this jar: it is shaded into the coremod plugin jar below (single copy, plugin layer),
    // which is embedded through jar-in-jar so both layers share the same TransformerLib classes.
    implementation 'portb:BiggerStacksTransformerLib:2026.02.24'

    // FancyModLoader class processors (plugin layer, FMLModType: LIBRARY), embedded via jar-in-jar
    implementation project(':coremod')
    jarJar project(':coremod')

    // Compat modules (compile against the target mods; they are supplied by the player at runtime)
    implementation 'maven.modrinth:sophisticated-core:1.21.11-1.5.2.2348'
    implementation 'maven.modrinth:sophisticated-backpacks:1.21.11-3.26.3.2168'
}

def modFullVersion = version.toString()

processResources {
    inputs.property 'version', modFullVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': modFullVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}
